# Extends gitleaks' default rules. Each allowlist is scoped to one file and only the rules that fire on it,
# so a real credential anywhere else (or any other rule firing in these files) still fails CI.
[extend]
useDefault = true

# Same entry as pharn-dev/phargus: pharn.records.json, the PHARN tooling's bookkeeping file, maps repository
# paths to SHA-256 hashes, and paths such as "secrets-in-code" make generic-api-key fire on those hashes.
[[allowlists]]
description = "pharn.records.json holds path-to-SHA-256 pairs, not credentials"
targetRules = ["generic-api-key"]
paths = ['''^pharn\.records\.json$''']

# The redaction test feeds made-up tokens through redactJson() to prove they are masked.
[[allowlists]]
description = "phargus redaction test fixtures are fake tokens"
targetRules = ["aws-access-token", "curl-auth-header", "jwt"]
paths = ['''^src/phargus/test/redact\.test\.mjs$''']
