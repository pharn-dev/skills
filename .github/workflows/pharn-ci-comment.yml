name: pharn-ci comment
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The default branch: the trusted .pharn/ci.yml, never the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # continue-on-error: the gating leg in ci.yml only uploads this artifact when its own
      # coverage run succeeded (see ci.yml's `steps.unit-tests.outcome` guard); when an earlier,
      # unrelated step failed the CI run first, no artifact exists, and this job should be a
      # clean no-op instead of a spurious failing check.
      - id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pharn-ci-input
          path: ${{ runner.temp }}/pharn-ci-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # Keep digits only. The artifact is attacker-controlled: never put its text into a script.
      - id: pr
        if: steps.download.outcome == 'success'
        env:
          PR_FILE: ${{ runner.temp }}/pharn-ci-input/pr-number
        run: |
          number=$(tr -dc '0-9' < "$PR_FILE" | head -c 10)
          if [ -z "$number" ]; then
            echo "::error::pr-number artifact entry is empty or non-numeric" >&2
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - if: steps.download.outcome == 'success'
        uses: pharn-dev/pharn-ci@a88e62a8febf5cd9a77b8e0252cd060c3b94782c # v0.1.0
        timeout-minutes: 5
        with:
          coverage-file: ${{ runner.temp }}/pharn-ci-input/coverage/lcov.info
          pr-number: ${{ steps.pr.outputs.number }}
          head-sha: ${{ github.event.workflow_run.head_sha }}
          fail-on-threshold: false # the phargus job in ci.yml already gates
