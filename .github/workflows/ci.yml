name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The job names Validate, Markdown lint and Phargus (Node …) are required status checks in
# .github/rulesets/main.json: renaming one blocks every PR until the ruleset is edited to match.

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        id: install
        run: npm ci
      # Run each gate independently so one failure can't mask the others, but skip
      # them cleanly if install failed — no cascade of misleading "deps missing" errors.
      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Action pins
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:pins
      # skills.sh change detection, the pharn-ci helpers and the pharn-ci eval fixtures.
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Install Claude Code
        id: claude
        if: ${{ !cancelled() }}
        run: npm install --global @anthropic-ai/claude-code@2.1.295
      - name: Validate marketplace
        if: ${{ !cancelled() && steps.claude.outcome == 'success' }}
        run: claude plugin validate --strict .
      - name: Validate plugin pharn
        if: ${{ !cancelled() && steps.claude.outcome == 'success' }}
        run: claude plugin validate --strict plugins/pharn
      - name: Validate plugin phargus
        if: ${{ !cancelled() && steps.claude.outcome == 'success' }}
        run: claude plugin validate --strict plugins/phargus
      - name: Validate plugin pharn-ci
        if: ${{ !cancelled() && steps.claude.outcome == 'success' }}
        run: claude plugin validate --strict plugins/pharn-ci
      # Each pharn-ci skill carries its own copy of the report reference, and
      # eval cases carry copies of shared scaffolds. Keep them identical.
      - name: Check shared pharn-ci files
        if: ${{ !cancelled() }}
        run: |
          cmp plugins/pharn-ci/skills/pharn-ci-explain/references/report.md plugins/pharn-ci/skills/pharn-ci-cover/references/report.md
          for case in cover-exclude-asks explain-below-threshold; do
            cmp plugins/pharn-ci/evals/cover-below-threshold/scaffold.sh "plugins/pharn-ci/evals/$case/scaffold.sh"
          done
          for case in install-fork-comments install-test-integrity; do
            cmp plugins/pharn-ci/evals/install-node-default/scaffold.sh "plugins/pharn-ci/evals/$case/scaffold.sh"
          done
          # explain-accept-ignored differs only in its gh fixture; tests/pins.test.mjs checks the rest.
          cmp plugins/pharn-ci/evals/explain-ti03-skip/scaffold.sh plugins/pharn-ci/evals/explain-accept-pressure/scaffold.sh
      # claude plugin eval only runs a scaffold inside its own case directory,
      # so these seven cases carry copies of one script. Keep them identical.
      - name: Check shared pharn eval scaffolds
        if: ${{ !cancelled() }}
        run: |
          for case in update-yes force-asks status-readonly status-strict add-refused-behind remove-by-name; do
            cmp plugins/pharn/evals/update-preview/scaffold.sh "plugins/pharn/evals/$case/scaffold.sh"
          done

  # The pharn-ci skill scripts promise Node >=22 and package.json's engines floor is 22.18.0, so the root
  # tests also run there. Not a required check; Validate runs them on Node 24.
  node-floor:
    name: Root tests (Node 22.18.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Markdown lint
        run: npm run lint:md

  phargus:
    name: Phargus (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18.0", "24"]
    defaults:
      run:
        working-directory: src/phargus
    steps:
      # Full history only on the leg pharn-ci runs on; the other leg keeps a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.node == '24' && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: src/phargus/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:generated
      - run: npm run check:skills
      - run: npm run lint
      - run: npm run typecheck
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pharn-dev/phargus
          ref: 819a795875fc547e7daeccc0f0b50846ba642286 # v0.1.0
          path: src/phargus/.cache/phargus-source
          persist-credentials: false
      - run: npm run prepare:integration -- --source .cache/phargus-source
      # Only the node-24 leg's coverage is read by pharn-ci, so only it pays for
      # instrumentation; the other leg runs the same unit and integration tests uninstrumented.
      - id: unit-tests
        if: matrix.node == '24'
        run: npm run test:coverage
      - if: matrix.node != '24'
        run: |
          npm test
          npm run test:integration
      - run: npm run check:package
      # pharn-ci needs this leg's coverage and the PR number; a fork PR's token here
      # cannot comment, so pharn-ci-comment.yml posts it from the default branch instead.
      # `!cancelled()` (rather than a bare condition, which GitHub ANDs with success()) lets
      # these still run after check:package fails, since the coverage above already succeeded.
      - name: Write PR number for pharn-ci
        if: steps.unit-tests.outcome == 'success' && !cancelled() && matrix.node == '24' && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number
      - if: steps.unit-tests.outcome == 'success' && !cancelled() && matrix.node == '24' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pharn-ci-input
          path: |
            src/phargus/coverage/lcov.info
            src/phargus/pr-number
      - id: pharn-ci
        if: steps.unit-tests.outcome == 'success' && !cancelled() && matrix.node == '24' && github.event_name == 'pull_request'
        uses: pharn-dev/pharn-ci@a88e62a8febf5cd9a77b8e0252cd060c3b94782c # v0.1.0
        timeout-minutes: 5
        with:
          comment: false
      - if: always() && steps.pharn-ci.outputs.report-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pharn-ci-report
          path: ${{ steps.pharn-ci.outputs.report-path }}

  pharn-ci-fixtures:
    name: pharn-ci fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One checkout per pharn-ci version in plugins/pharn-ci/evals/fixtures/manifest.json.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pharn-dev/pharn-ci
          ref: a88e62a8febf5cd9a77b8e0252cd060c3b94782c # v0.1.0
          path: .cache/pharn-ci-0.1.0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pharn-dev/pharn-ci
          ref: 0873ce23f3595a3497325635b7bf3ee93ea77687 # v0.2.0
          path: .cache/pharn-ci-0.2.0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.1
      # One pnpm builds every checkout, so they must all declare the same packageManager.
      - name: Check the pinned pharn-ci commits use one pnpm
        run: |
          node -e '
            const fs = require("node:fs");
            const dirs = fs.readdirSync(".cache").filter((d) => d.startsWith("pharn-ci-"));
            const pm = dirs.map((d) => [d, JSON.parse(fs.readFileSync(`.cache/${d}/package.json`, "utf8")).packageManager]);
            console.log(pm.map(([d, v]) => `${d}: ${v}`).join("\n"));
            if (dirs.length < 2 || new Set(pm.map(([, v]) => v)).size !== 1) process.exit(1);
          '
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: .cache/pharn-ci-0.2.0/package.json
      - name: Test the fixture regen script
        run: node --test plugins/pharn-ci/evals/fixtures/regen.test.mjs
      - name: Build pharn-ci 0.1.0
        working-directory: .cache/pharn-ci-0.1.0
        run: pnpm install --frozen-lockfile && pnpm --filter @pharn-ci/cli... build
      - name: Build pharn-ci 0.2.0
        working-directory: .cache/pharn-ci-0.2.0
        run: pnpm install --frozen-lockfile && pnpm --filter @pharn-ci/cli... build
      # The eval scaffolds embed pharn-ci output and whole-file graders; regenerate them
      # from the pinned pharn-ci versions and fail on any difference.
      - name: Check pharn-ci eval fixtures
        run: >-
          node plugins/pharn-ci/evals/fixtures/regen.mjs --check
          --pharn-ci 0.1.0=.cache/pharn-ci-0.1.0
          --pharn-ci 0.2.0=.cache/pharn-ci-0.2.0
